name: Deploy Backend to Goggle App Engine

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js and yarn
        uses: actions/setup-node@v2
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./backend
        run: yarn install --frozen-lockfile

      - name: Build Node Project
        working-directory: ./backend
        run: |
          yarn build

          touch .env

          echo SERVICE_PORT=${{ vars.SERVICE_PORT }} >> .env
          echo SERVICE_HOST=${{ vars.SERVICE_HOST }} >> .env
          echo SERVICE_NAME=${{ vars.SERVICE_NAME }} >> .env
          echo BUILD_DOCS=${{ vars.BUILD_DOCS }} >> .env
          echo JWT_EXPIRATION_TIME=${{ vars.JWT_EXPIRATION_TIME }} >> .env
          echo CORS_ORIGIN=${{ vars.CORS_ORIGIN }} >> .env
          echo CORS_METHODS=${{ vars.CORS_METHODS }} >> .env

          echo DB_DATABASE=${{ secrets.DB_DATABASE }} >> .env
          echo DB_HOST=${{ secrets.DB_HOST.env
          echo DB_PASSWORD=${{ secrets.DB_PASSWORD }} >> .env
          echo DB_PORT=${{ secrets.DB_PORT }} >> .env
          echo DB_USERNAME=${{ secrets.DB_USERNAME }} >> .env
          echo JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} >> .env

      - name: Google Cloud Auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"

      - name: Deploy to Google App Engine
        working-directory: ./backend
        run: "gcloud app deploy app.yaml --quiet"
